<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>6 ORD Gate Prod Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .grid {
            display: grid;

            /* Three columns and two rows. */
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));

            width: 100vw;
            height: 100vh;

            gap: 0;
        }

        .panel {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: black;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;

            /*
             * Render each source page at the dashboard's full size.
             * At a 1920 x 1200 browser viewport, each iframe's
             * unscaled viewport is also 1920 x 1200.
             */
            width: 100vw;
            height: 100vh;

            border: none;
            display: block;

            /*
             * Fit each page into one of the six panels:
             * width  = 1920 / 3 = 640
             * height = 1200 / 2 = 600
             */
            transform: scale(calc(1 / 3), 0.5);
            transform-origin: top left;
        }
    </style>
</head>

<body>
    <main class="grid">

        <div class="panel">
            <iframe
                title="ORD Gate G6"
                src="https://ord-ws.visionairfids.com/?secret=CON_G_G6"
                referrerpolicy="no-referrer">
            </iframe>
        </div>
