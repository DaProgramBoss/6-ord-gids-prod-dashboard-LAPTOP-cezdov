<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>6 ORD Gate Prod Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .grid {
            display: grid;

            /* Three columns and two rows. */
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));

            width: 100vw;
            height: 100vh;

            gap: 0;
        }

        .panel {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: black;
        }

        /* Default settings for all six displays. */
        iframe {
            position: absolute;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            border: none;
            display: block;

            transform: scale(calc(1 / 3), 0.5);
            transform-origin: top left;
        }

        /*
         * G6 only: display at 80% of its previous size.
         *
         * Increase the internal viewport to compensate,
         * so the iframe still fills its grid panel.
         */
        #g6 {
    width: 166.666667vw;
    height: 166.666667vh;

    transform: scale(calc(0.6 / 3), calc(0.6 / 2));
}
    </style>
</head>

<body>
    <main class="grid">

        <!-- Top left: G6, individually zoomed out. -->
        <div class="panel">
            <iframe
                id="g6"
                title="ORD Gate G6"
                src="https://ord-ws.visionairfids.com/?secret=CON_G_G6"
                referrerpolicy="no-referrer">
            </iframe>
        </div>

        <!-- Top center: G10. -->

                title="ORD Gate G10"

        </div>

        <!-- Bottom left: G12. -->
        <div class="panel">

                title="ORD Gate G12"

        <!-- Bottom center: G14. -->

    </main>
</body>
</html>
